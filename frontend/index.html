<!DOCTYPE html>
<html>
    <head>
        <title>URL Shortener</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>URL Shortener</h1>
        <p>A simple and efficient URL Shortener application that converts long URLs<br>
        into short, shareable links.<br><br>
        Paste any valid URL, generate a shortened version instantly,<br>
        and get redirected seamlessly to the original website.</p><br>

        <input type="url" placeholder="Enter valid URL" id="urlInput" required>
        <button id="shortenBtn">Shorten URL</button><br><br>

        <h2>Shortened URL</h2>
        <p id="result"></p>

        <script src="urlScript.js"></script>
    </body>
</html>
