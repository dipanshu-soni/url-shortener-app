<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="device-width, initial-scale=1.0">
        <title>URL Shortener App</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            <div class="text">
                <h1>Smart Links That Drive Results !</h1>
                <p>Welcome to a simple and efficient URL Shortener application that converts long URLs<br>
                into short, shareable links.<br>
                Paste any valid URL, generate a shortened version instantly,<br>
                and get redirected seamlessly to the original website.</p>
            </div>

            <div class="form">
                <h2>URL Shortener App</h2>
                <input type="text" placeholder="Enter valid URL" id="urlInput" required>
                <div id="output-field" class="output-box">
                    <p>Shortened URL</p>
                </div>
                
                <button type="submit" id="shortenBtn">Submit</button>
            </div>
        </div>
        <script src="urlScript.js"></script>
    </body>
</html>
